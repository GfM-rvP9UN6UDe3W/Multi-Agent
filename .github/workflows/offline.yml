name: Offline contracts and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.18.0
            python: 3.11.13
          - os: ubuntu-24.04
            node: 24.14.0
            python: 3.14.6
          - os: macos-14
            node: 22.18.0
            # Last upstream 3.11 macOS arm64 installer in actions/python-versions.
            python: 3.11.9
          - os: macos-14
            node: 24.14.0
            python: 3.14.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run check:generated && npm run typecheck && npm run format:check
      - name: Node contract tests
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm test 2>&1 | tee dist/verification/ci/node.log
      - name: Python contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm run test:python 2>&1 | tee dist/verification/ci/python.log
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.2.2.post1 packaging==25.0 pyproject_hooks==1.2.0
      - run: npm run build:packages
      - run: python scripts/build-python.py dist/release
      - name: Clean offline npm, wheel and sdist installation
        run: PACKAGE_BUILD_PYTHON="$(command -v python)" npm run test:packages
      - run: node scripts/capacity-benchmark.ts 1000,10000 100 > dist/capacity.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: offline-${{ matrix.os }}-node-${{ matrix.node }}-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: ignore
  pinned-native-protocol:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel covers x86-64 Macs; macos-14 is Apple silicon.
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - run: npm ci --ignore-scripts
      - name: Install exact native development dependencies (no login or model calls)
        run: npm install --ignore-scripts --no-save --package-lock=false @anthropic-ai/claude-agent-sdk@0.3.274 @openai/codex@0.153.4
      - run: node scripts/check-native-protocol.mjs
      # The writable Claude profile requires the OS sandbox; on Linux that is bubblewrap and socat.
      - name: Install the Linux sandbox dependencies of the writable Claude profile
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Real Claude binary with a scripted loopback gateway (no paid models)
        run: node scripts/native-gateway-smoke.mjs claude dist/verification/native-claude.json
      - name: Real Codex binary with a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-gateway-smoke.mjs codex dist/verification/native-codex.json ./node_modules/.bin/codex
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-gateway-${{ matrix.os }}
          path: dist/verification/
