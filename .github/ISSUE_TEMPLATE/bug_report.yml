name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code or commands that show the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Orchvia, Node.js, Python, operating system, and Claude Code or Codex if involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Remove credentials and private paths first.
      render: text
